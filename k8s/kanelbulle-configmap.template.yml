apiVersion: v1
kind: ConfigMap
metadata:
  name: kanelbulle-config
  namespace: kanelbulle
data:
  config.toml: |
    [server]
    port = ":9999"

    [auth]
    enabled = true
    redis_url = "redis://<REDIS_HOST>:6379"
    token_header = "Authorization"
    token_key_template = "auth:{course}:{student}"

    [database]
    dsn = "postgres://<DB_USER>:<DB_PASSWORD>@<DB_HOST>:5432/<DB_NAME>?sslmode=disable"

    [api]
    student_id_header = "X-STUDENT"
    lab_id_header = "X-LAB"

    [[api.required_headers]]
    name = "<REQUIRED_HEADER_NAME>"
    value = "<REQUIRED_HEADER_VALUE>"

    [bot]
    admin_ids = [<ADMIN_TELEGRAM_ID>]
    token = "<TELEGRAM_BOT_TOKEN>"

    [events]
    start = "000_lab_start"
    finish = "100_lab_finish"

    [scoring]
    default_late_penalty = 0.5
    max_late_days = 7
    extra_late_penalty = 1

    [scoring.late_days_modifiers]
    0 = 0
    1 = -3
    2 = -5

    [display]
    timestamp_format = "YYYY-MM-DD HH24:MI:SS"
    go_timestamp_format = "2006-01-02 15:04:05"
    emoji_variants = ["🤖", "🦄", "🐕", "🔬", "🐉", "🦥", "🐙", "🐈", "🎓", "🐊", "🦊"]

    [[gsheet.<COURSE_CODE>]]
    schedule = "*/5 * * * *"
    course = "<COURSE_CODE>"
    sheet_id = "<GOOGLE_SHEET_ID>"
    credentials_path = "/secrets/creds.json"
    sheet_name = "<SHEET_NAME>"
    students_range = "B3:B27"
    labs_range = "F3:G27"
    timestamp_range = "A1:B1"
    scoring = false
    labs_list = ["01", "02"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kanelbulle-migrations
  namespace: kanelbulle
data:
  01_create_entries.sql: |
    CREATE TABLE IF NOT EXISTS entries (
        timestamp BIGINT NOT NULL,
        event_type TEXT NOT NULL,
        lab VARCHAR(3) NOT NULL,
        student TEXT NOT NULL,
        course VARCHAR(32) NOT NULL,
        comment TEXT
    );

  02_create_lab_scores.sql: |
    CREATE TABLE IF NOT EXISTS lab_scores (
        deadline BIGINT NOT NULL,
        lab VARCHAR(3) NOT NULL,
        base_score INTEGER NOT NULL,
        course VARCHAR(32) NOT NULL,
        CONSTRAINT lab_scores_pkey PRIMARY KEY (course, lab)
    );

  03_create_score_overrides.sql: |
    CREATE TABLE IF NOT EXISTS score_overrides (
        student TEXT NOT NULL CHECK (student ~ '^[\w-]+\..+$'),
        lab VARCHAR(3) NOT NULL,
        score INTEGER NOT NULL,
        course VARCHAR(32) NOT NULL,
        reason TEXT,
        CONSTRAINT score_overrides_pkey PRIMARY KEY (course, lab, student)
    );
