apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanelbulle-server
  namespace: kanelbulle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kanelbulle-server
  template:
    metadata:
      labels:
        app: kanelbulle-server
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: server
          image: ghcr.io/shrimpsizemoose/kanelbulle-server:0.4.0
          command: ["/server"]
          args: ["-config", "/config/config.toml"]
          env:
            - name: KANELBULLE_DEBUG_REQUESTS
              value: "true"
            - name: KANELBULLE_LOG_403
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: migrations
              mountPath: /migrations
            - name: gcp-creds
              mountPath: /secrets
              readOnly: true
          ports:
            - containerPort: 9999
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9999
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9999
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: kanelbulle-config
        - name: migrations
          configMap:
            name: kanelbulle-migrations
        - name: gcp-creds
          secret:
            secretName: gsheet-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: kanelbulle-server
  namespace: kanelbulle
spec:
  type: NodePort
  selector:
    app: kanelbulle-server
  ports:
    - name: http
      port: 9999
      targetPort: 9999
      nodePort: 30999
